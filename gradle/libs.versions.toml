# One place for every version. Dependabot (weekly, into staging) keeps these current; see docs/decisions/tooling.md.
[versions]
androidx-test-core = "1.6.1"
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
coroutines = "1.11.0"
serialization = "1.13.0"
okhttp = "5.5.1"
zxing = "3.5.4"
coil = "3.6.3"
compose-bom = "2026.09.00"
core = "1.19.1"
activity = "1.13.0"
fragment = "1.9.1"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
paging = "3.5.3"
work = "2.12.0"
tvprovider = "1.1.0"
datastore = "1.3.0"
