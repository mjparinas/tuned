name: Baseline profile

# Generates the app's baseline profile on an emulator and measures cold start with and without it
# (docs/decisions/speed.md). It is not part of "CI passed": an emulator run takes about half an hour, and the
# profile only needs refreshing when the first minute of the app changes. Run it by hand, or let a pull request
# that changes the journeys run it. The profile comes back as an artifact to commit under app/src/release/generated/.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - baselineprofile/**
      - .github/workflows/baseline-profile.yml

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    name: Generate and measure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GMD: -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
    steps:
      - uses: actions/checkout@v7
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android
      - name: Generate the profile
        run: ./gradlew :app:generateBaselineProfile $GMD --no-configuration-cache
      - name: Measure cold start without and with it
        run: >
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest $GMD --no-configuration-cache
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
      - name: Write the numbers to the summary
        if: ${{ !cancelled() }}
        run: node scripts/startup-summary.mjs baselineprofile/build >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: baseline-profile
          path: |
            app/src/release/generated/baselineProfiles/
            baselineprofile/build/outputs/**/*benchmarkData.json
          retention-days: 14
