name: CI

# Modelled on Liftsmith's CI (Melvin, 2026-11-17: "follow the similar dev tooling as the other apps"). Every job
# runs in parallel; "CI passed" is the one check to require in branch protection, and it is green only when every
# other job is (a skipped job counts as passed).

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What this run has to do, as in Liftsmith:
  #  1. Nothing, when this exact tree already passed. "CI passed" records the tree it tested as a commit status
  #     ("CI passed tree"), so the staging push after a squash merge, the promotion pull request, the push
  #     to main and the merge back into staging finish in seconds.
  #  2. Only Prettier and the gate, when every changed file is Markdown or under docs/ (Melvin, 2026-11-19: "dont run
  #     ci if there are only markdown file changes"). Docs can't break a build, a test or the app, so this doesn't wait
  #     on the commit before it having passed; Prettier still checks them, in seconds, so the next pull request isn't
  #     the one to fail on their formatting. The tree is recorded as passed only when the commit before it passed too.
  #  3. Only what the change touches (Melvin, 2026-11-19: "if there are only changes to the web app, only build the
  #     webapp and skip mobile builds and vice versa"): the website's tests for devices/, the app's Gradle jobs for the
  #     app, and both for anything shared (workflows, scripts/, package.json). scripts/ci-changes.mjs decides.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
      docs: ${{ steps.diff.outputs.docs }}
      mobile: ${{ steps.diff.outputs.mobile }}
      web: ${{ steps.diff.outputs.web }}
      tizen: ${{ steps.diff.outputs.tizen }}
      vega: ${{ steps.diff.outputs.vega }}
      record: ${{ steps.diff.outputs.record }}
      warm: ${{ steps.diff.outputs.warm }}
      tree: ${{ steps.diff.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          everything() { { echo "run=true"; echo "mobile=true"; echo "web=true"; echo "tizen=true"; echo "vega=true"; } >> "$GITHUB_OUTPUT"; exit 0; }
          recorded() {
            desc=$(gh api "repos/$REPO/commits/$1/statuses?per_page=100" \
              --jq '[.[] | select(.context == "CI passed tree")][0] | select(.state == "success") | .description' 2>/dev/null || true)
            [ "$desc" = "Passed on tree $2" ]
          }
          # Whether CI passed on commit $1 with tree $2: on the commit itself or, for a merge pushed with GITHUB_TOKEN
          # (which starts no CI: the promotion's "Bring main back into staging"), on a parent with exactly the same
          # files, up to three merges back. Without this, the first pull request after a promotion couldn't record its
          # tree, nor could any after it, and every merge into staging ran the whole of CI again (2026-11-21).
          passed() {
            local sha=$1 depth info parents p
            [ -n "$sha" ] || return 1
            for depth in 1 2 3 4; do
              recorded "$sha" "$2" && return 0
              info=$(gh api "repos/$REPO/commits/$sha" --jq '[.commit.tree.sha] + [.parents[].sha] | join(" ")' 2>/dev/null) || return 1
              [ "${info%% *}" = "$2" ] || return 1
              parents=${info#* }
              [ "$parents" != "$info" ] || return 1
              sha=""
              for p in $parents; do
                if [ "$(gh api "repos/$REPO/commits/$p" --jq .commit.tree.sha 2>/dev/null)" = "$2" ]; then sha=$p; break; fi
              done
              [ -n "$sha" ] || return 1
            done
            return 1
          }

          candidates="$(git rev-parse HEAD^@ 2>/dev/null || true)"
          if [ "$EVENT" = push ]; then
            candidates="$GITHUB_SHA $candidates $(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[].head.sha' 2>/dev/null || true)"
          fi
          # A merge into staging that already passed still refreshes the Gradle cache when it touched the app, since only
          # main and staging write it and pull requests build from it (the Gradle cache jobs below).
          warm() {
            [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/staging ] || return 0
            case "$BEFORE" in ""|0000000000000000000000000000000000000000) return 0 ;; esac
            git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || return 0
            if git diff --name-only "$BEFORE" HEAD | node scripts/ci-changes.mjs | grep -q 'mobile=true'; then
              echo "warm=true" >> "$GITHUB_OUTPUT"
              echo "::notice::The app changed, so the Gradle cache is refreshed for the next pull requests."
            fi
          }
          for c in $candidates; do
            if passed "$c" "$tree"; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::notice::This exact tree already passed CI on ${c:0:7}, so nothing runs again."
              warm
              exit 0
            fi
          done

          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          else
            base=$BEFORE
            case "$base" in ""|0000000000000000000000000000000000000000) everything ;; esac
            git fetch --no-tags --depth=1 origin "$base" || everything
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          [ -n "$files" ] || everything
          needs=$(node scripts/ci-changes.mjs <<< "$files") || everything
          echo "$needs"
          if ! grep -q '=true' <<< "$needs"; then
            { echo "run=false"; echo "docs=true"; } >> "$GITHUB_OUTPUT"
            if passed "$base" "$(git rev-parse "$base^{tree}")"; then
              echo "::notice::Only Markdown or docs/ changed and ${base:0:7} passed CI, so only Prettier runs."
            else
              echo "record=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Only Markdown or docs/ changed, so only Prettier runs. ${base:0:7} hasn't passed CI (yet), so this tree isn't recorded as passed."
            fi
            exit 0
          fi
          { echo "run=true"; echo "$needs"; } >> "$GITHUB_OUTPUT"
          # A skipped half is vouched for only by the commit before it, so record the tree only when that one passed.
          if grep -q '=false' <<< "$needs" && ! passed "$base" "$(git rev-parse "$base^{tree}")"; then
            echo "record=false" >> "$GITHUB_OUTPUT"
          fi
          grep -q 'mobile=true' <<< "$needs" || echo "::notice::The Android app didn't change, so its builds and tests are skipped."
          grep -q 'web=true' <<< "$needs" || echo "::notice::The website (devices/) didn't change, so its tests are skipped."

  # Node only, so it needs no Java or Gradle and finishes in under a minute. ktlint runs in Checks, which has Gradle.
  # On a docs-only change only Prettier runs, and the website's tests run only when devices/ (or something shared) changed.
  format:
    name: Formatting
    needs: changes
    if: needs.changes.outputs.run == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Release version script tests
        if: needs.changes.outputs.run == 'true'
        run: node --test scripts/*.test.mjs
      - name: Premium device list tests
        if: needs.changes.outputs.web == 'true'
        run: node --test devices/lib/*.test.mjs devices/lib/admin/*.test.mjs
      # Every page of the website in light and dark against WCAG 2.2 AA with axe-core, plus 320px reflow and focus
      # rings (devices/a11y-check.mjs; docs/decisions/website.md › Accessibility and standards). About a minute.
      - name: Cache Chromium for the accessibility check
        if: needs.changes.outputs.web == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Website accessibility check
        if: needs.changes.outputs.web == 'true'
        run: |
          npx playwright install --with-deps chromium
          node devices/a11y-check.mjs
      - name: Prettier (YAML, JSON, Markdown)
        run: npx prettier --check .

  # ktlint, detekt, Android Lint and the unit tests in one job (2026-11-19, AGENTS.md › CI/CD): they all need the
  # debug variant compiled, so one runner compiles it once instead of two runners compiling it twice, and each run
  # takes one runner fewer from the account's 20 at a time. It still finishes before the Android build.
  checks:
    name: Lint, static analysis and unit tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Gradle cache entry this job reads, shared with "Gradle cache for the checks", which writes it.
    env: &checks-cache
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: checks
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - uses: ./.github/actions/robolectric-cache
        id: robolectric
      # ktlint, detekt and Android Lint fail on any finding (warnings are errors). --continue runs every check and
      # every test even after one fails, so one run shows everything that needs fixing.
      - run: ./gradlew spotlessCheck detekt :app:lintGithubDebug :core:test :core:animalsnifferMain :app:testGithubDebugUnitTest --continue
      - name: Print the findings
        if: failure()
        run: cat app/build/reports/lint-results-githubDebug.txt build/reports/detekt/detekt.txt 2>/dev/null || true
      - name: Keep the Android test runtime for next time
        if: ${{ !cancelled() && steps.robolectric.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.robolectric.outputs.path }}
          key: ${{ steps.robolectric.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-reports
          path: |
            build/reports/detekt/
            app/build/reports/lint-results-githubDebug.html
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7

  android:
    name: Android build
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    # 25 minutes, plus about 15 the first time a Media3 version's decoder is built.
    timeout-minutes: 40
    # The Gradle cache entry this job reads, shared with "Gradle cache for the Android build", which writes it.
    env: &android-cache
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: android
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      # The Dolby and DTS decoder, built once per Media3 version and cached, so R8 sees it here as in Release.
      - uses: ./.github/actions/ffmpeg-decoder
        with:
          required: "false"
      # Unsigned release builds of the GitHub, Play and Fire TV builds, so R8 fails here on a missing keep rule, not in
      # Release. No debug APK: Melvin
      # (2026-11-18) installs only production releases, and lint and the unit tests already compile the debug variant.
      # Without the release lint pass (lintVital), which repeats Android Lint in Checks and took about 2 minutes of the
      # build's CPU (Melvin, 2026-11-19). Release builds in release.yml still run it.
      - run: ./gradlew :app:assembleRelease -x lintVitalGithubRelease -x lintVitalPlayRelease -x lintVitalAmazonRelease
        env:
          # The commit shown at the bottom of Settings: a pull request's own head, not the merge commit GitHub builds.
          GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

  # Pull requests only read the Gradle cache, and since 2026-11-21 a merge into staging whose tree already passed runs
  # nothing, so the cache would stop following staging and every pull request would compile all of it again. These two
  # build what Checks and the Android build build, under their cache names, after each such merge that touched the app.
  # "CI passed" doesn't wait for them, so a promotion doesn't either; a failure here only means a colder cache.
  checks-cache:
    name: Gradle cache for the checks
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *checks-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - uses: ./.github/actions/robolectric-cache
      - run: ./gradlew spotlessCheck detekt :app:lintGithubDebug :core:test :core:animalsnifferMain :app:testGithubDebugUnitTest --continue

  android-cache:
    name: Gradle cache for the Android build
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: *android-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - uses: ./.github/actions/ffmpeg-decoder
        with:
          required: "false"
      - run: ./gradlew :app:assembleRelease -x lintVitalGithubRelease -x lintVitalPlayRelease -x lintVitalAmazonRelease

  # The github debug app on an emulator against a fake provider: sign in, play, change channel, go back, and never two
  # stream connections at once (smoketest/, docs/decisions/diagnostics.md).
  device:
    name: Device smoke test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The Gradle cache entry this job reads, shared with "Gradle cache for the smoke test", which writes it.
    env: &device-cache
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: device
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: ci
    steps:
      - uses: actions/checkout@v7
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android
      # The emulator and its image are cached together: with only the image restored, the managed device's setup
      # skips installing the emulator and fails with "Cannot query the value of this property".
      - name: Keep the emulator and its image between runs
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/aosp_atd
          key: gmd-android-34-aosp-atd-emulator
      - run: >
          ./gradlew :smoketest:pixel6Api34GithubDebugAndroidTest --no-configuration-cache
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-test-reports
          path: smoketest/build/outputs/
          retention-days: 7

  # Builds the two APKs the smoke test installs, without an emulator, so its Gradle cache follows staging too.
  device-cache:
    name: Gradle cache for the smoke test
    needs: changes
    if: needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *device-cache
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - run: ./gradlew :app:assembleGithubDebug :smoketest:assembleGithubDebug --no-configuration-cache

  # Melvin, 2026-11-17: the decision record "should be updated and kept in sync every time new features are added
  # or removed". A pull request titled feat:, breaking (!), revert or remove must change AGENTS.md or docs/decisions/.
  # It reads only the title and the file list, so it runs even when the tree already passed.
  decisions:
    name: Decision record
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Feature changes update AGENTS.md or docs/decisions/
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' | node scripts/decision-record.mjs

  # The Samsung TV app (tv/tizen) and what it shares with the Vega OS app: :core's rules compiled to JavaScript and
  # tested there (tv/core), then tv/shared's tests and type check. Only when tv/, :core or the Gradle setup changed.
  tizen:
    name: Samsung TV app
    needs: changes
    if: needs.changes.outputs.tizen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/tv-core
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Shared TV code
        working-directory: tv/shared
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck

  passed:
    name: CI passed
    needs: [changes, decisions, format, checks, android, device, tizen]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ needs.changes.result }}" != "success" ] || [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
      - name: Record the tested tree
        if: needs.changes.outputs.record != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context="CI passed tree"
          -f description="Passed on tree ${{ needs.changes.outputs.tree }}" --silent
