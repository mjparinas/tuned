# Renders every screen with made-up sample data (app/src/test/kotlin/app/tuned/screenshots) and uploads the PNGs.
# Not a required check: it is for looking at the UI on a pull request without installing the APK.
name: Screenshots

on:
  pull_request:
    paths: [app/**, gradle/**, .github/workflows/screenshots.yml]
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - run: ./gradlew :app:testDebugUnitTest -Pscreenshots
      # Also in the log as base64, for tools that can read logs but not download artifacts.
      - name: Print screenshots
        if: always()
        run: |
          echo "::group::screenshots.tar.gz (base64)"
          echo "BEGIN-SCREENSHOTS"
          tar czf - -C app/build/outputs/roborazzi . | base64 -w 120
          echo "END-SCREENSHOTS"
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: app/build/outputs/roborazzi
          if-no-files-found: warn
