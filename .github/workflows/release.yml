name: Release

# On every promotion to main (nightly or by hand; promote-staging.yml dispatches this, because a merge made with
# GITHUB_TOKEN doesn't fire `push`) and on demand: builds a signed App Bundle and uploads it to the Play internal
# track. Installed copies then update themselves through Play's in-app updates (docs/decisions/updates.md).
# Version name comes from package.json, version code from the run number. Skips itself with a notice until the
# signing and Play secrets exist. The very first upload has to be done by hand in Play Console.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android · Play internal track
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::ANDROID_KEYSTORE_B64 is not set, so the Android release is skipped."
      - uses: actions/checkout@v7
        if: env.HAS_KEY == 'true'
      - uses: ./.github/actions/setup-android
        if: env.HAS_KEY == 'true'
      - id: v
        if: env.HAS_KEY == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Signed app bundle
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.v.outputs.version }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v7
        if: env.HAS_KEY == 'true'
        with:
          name: tuned-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Upload to Play (internal)
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.tuned
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
          # Play's in-app updates read this: 5 makes installed copies update at once (docs/decisions/updates.md).
          inAppUpdatePriority: 5
      - if: env.HAS_KEY == 'true' && env.HAS_PLAY != 'true'
        run: echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle was built (see artifacts) but not uploaded."
